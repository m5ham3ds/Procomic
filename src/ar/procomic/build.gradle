ext {
    extName = 'ProComic'
    pkgNameSuffix = 'ar.procomic'
    extClass = '.ProComic'
    extVersionCode = 1
    isNsfw = false
}

apply from: "$rootDir/common.gradle"

android {
    signingConfigs {
        release {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
